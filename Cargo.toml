[package]
name = "ailly"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
env_logger = "0.11.10"
futures = "0.3.31"
log = "0.4.29"
rig-core = "0.36.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
toml = "1.1.2"
vfs = { version = "0.13.0", features = ["tokio"] }

[[test]]
name = "engine_simple_noop"
path = "tests/engine/simple_noop.rs"
