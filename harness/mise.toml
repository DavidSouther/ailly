[tasks.ailly]
description = "Run locally built Ailly"
run = "cargo run"

[tasks.format]
description = "Format source files"
run = "cargo fmt"

[tasks.check]
description = "Static analysis"
run = "cargo check --all-features --all-targets"

[tasks.test]
description = "Run tests"
run = "cargo nextest run --all-features --all-targets"

[tasks.lint]
description = "Lint changed files"
run = "cargo clippy --all-features --all-targets -- -D warnings"

[tasks.fix]
description = "Auto-fix clippy warnings across all features and targets, then format"
run = """
set -e
cargo clippy --fix --allow-dirty --all-features --all-targets
mise run format
"""

[tasks.bump-nightly]
description = "Pin rust-toolchain.toml to the latest available nightly date"
run = """
set -e
LATEST=$(curl -sSf https://static.rust-lang.org/dist/channel-rust-nightly-date.txt)
sed -i.bak "s/nightly-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]/nightly-${LATEST}/" rust-toolchain.toml && rm -f rust-toolchain.toml.bak
mise run fix
echo "Pinned to nightly-${LATEST}"
test -z "${GITHUB_ENV}" || echo "LATEST=${LATEST}" >> "${GITHUB_ENV}"
"""
