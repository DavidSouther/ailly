  RUBRIC:
  The code introduces a UserId type that wraps a string, exposes
  construction as the only sanctioned entry point, and makes a plain
  string unassignable where UserId is required. There are no `as`
  casts at call sites; validation lives once in the constructor.


  USER QUESTION:
  Two ids flow through our billing code as raw strings: `invoiceId` and
  `customerId`. We just shipped a refund that credited the wrong party
  because someone passed `customerId` into a helper that expected
  `invoiceId`, and TypeScript didn't complain because they're both just
  `string`. Give me distinct types for these two ids so a mixup like that
  fails to compile. Show the type declarations and the one call site that
  looks up an invoice by its id. Don't reach for a full entity class or an
  ORM model -- I only want the compile-time guard.


  CANDIDATE RESPONSE:
  ```typescript
  // ── Brand declarations ────────────────────────────────────────────────────────

  declare const __invoiceId: unique symbol;
  declare const __customerId: unique symbol;

  export type InvoiceId  = string & { readonly [__invoiceId]:  never };
  export type CustomerId = string & { readonly [__customerId]: never };

  // ── Casting helpers (single place where raw strings enter the type system) ────

  export const toInvoiceId  = (raw: string): InvoiceId  => raw as InvoiceId;
  export const toCustomerId = (raw: string): CustomerId => raw as CustomerId;

  // ── Example call site ─────────────────────────────────────────────────────────

  declare function lookupInvoice(id: InvoiceId): Promise<unknown>;

  const invoiceId:  InvoiceId  = toInvoiceId("inv_001");
  const customerId: CustomerId = toCustomerId("cus_abc");

  await lookupInvoice(invoiceId);   // ✅ compiles
  await lookupInvoice(customerId);  // ✅ TS error: CustomerId is not assignable to InvoiceId
  ```

  **Why this works.**
  Both `InvoiceId` and `CustomerId` are intersection types — `string` plus a unique phantom brand that exists only at compile time and vanishes entirely at runtime. Because each brand key is a `unique symbol`, the two types are mutually incompatible even though the underlying runtime value is a plain string. The casting helpers (`toInvoiceId` / `toCustomerId`) are the only spots that use `as`, so every coercion is traceable to a deliberate boundary.
