  USER QUESTION:
  In our warehouse service, `sku` and `binLocation` are both represented
  as plain strings, and a picker-app integration test just caught a call
  that passed a bin location where a SKU was expected -- it compiled fine
  and failed at runtime. I want the compiler to catch that instead. Add
  `Sku` and `BinLocation` wrapper types and show the constructor for each
  plus a single `moveStock(sku, from, to)` signature that uses them. Keep
  it minimal -- just the types and validation, not a full inventory
  aggregate.


  CANDIDATE RESPONSE:
  ```typescript
  // newtype.ts – brand types for warehouse identifiers
  //
  // A "newtype" wraps a primitive in a branded intersection so the compiler
  // treats each flavour as a distinct type even though the runtime value is
  // still a plain string.  The only way to obtain a branded value is through
  // the smart constructor, which is also where format validation lives.

  // ---------------------------------------------------------------------------
  // Brand helper
  // ---------------------------------------------------------------------------

  /** Attach a phantom brand to a base type without changing its runtime shape. */
  type Brand<Base, Tag extends string> = Base & { readonly __brand: Tag };

  // ---------------------------------------------------------------------------
  // Sku
  // ---------------------------------------------------------------------------

  export type Sku = Brand<string, "Sku">;

  /**
   * Construct a validated {@link Sku}.
   *
   * Accepted format: one-to-three uppercase letters followed by a hyphen and
   * four-to-eight digits, e.g. `WIDGET-00042`.
   *
   * @throws {TypeError} when `raw` does not match the expected format.
   */
  export function Sku(raw: string): Sku {
    if (!/^[A-Z]{1,3}-\d{4,8}$/.test(raw)) {
      throw new TypeError(
        `Invalid SKU "${raw}". Expected format: 1-3 uppercase letters, ` +
          `a hyphen, and 4-8 digits (e.g. "WID-00042").`
      );
    }
    return raw as Sku;
  }

  // ---------------------------------------------------------------------------
  // BinLocation
  // ---------------------------------------------------------------------------

  export type BinLocation = Brand<string, "BinLocation">;

  /**
   * Construct a validated {@link BinLocation}.
   *
   * Accepted format: aisle letter (A-Z), two-digit bay, a hyphen, and
   * two-digit level, e.g. `B03-02`.
   *
   * @throws {TypeError} when `raw` does not match the expected format.
   */
  export function BinLocation(raw: string): BinLocation {
    if (!/^[A-Z]\d{2}-\d{2}$/.test(raw)) {
      throw new TypeError(
        `Invalid bin location "${raw}". Expected format: aisle letter, ` +
          `two-digit bay, a hyphen, and two-digit level (e.g. "B03-02").`
      );
    }
    return raw as BinLocation;
  }

  // ---------------------------------------------------------------------------
  // moveStock – type signature that enforces correct argument order
  // ---------------------------------------------------------------------------

  /**
   * Record a stock movement in the warehouse.
   *
   * Because {@link Sku} and {@link BinLocation} are distinct branded types the
   * compiler will reject a call that accidentally swaps `sku` for a bin string
   * or vice-versa – exactly the class of mistake caught by the integration test.
   */
  export function moveStock(sku: Sku, from: BinLocation, to: BinLocation): void {
    console.log(
      `Moving SKU ${sku} from bin ${from} to bin ${to}`
    );
  }

  // ---------------------------------------------------------------------------
  // Example call site
  // ---------------------------------------------------------------------------

  const sku      = Sku("WID-00042");
  const fromBin  = BinLocation("A01-03");
  const toBin    = BinLocation("B03-02");

  moveStock(sku, fromBin, toBin);

  // The following line would be a compile-time error – a BinLocation cannot be
  // passed where a Sku is expected, even though both are strings at runtime:
  //
  //   moveStock(fromBin, sku, toBin);
  //   ~~~~~~~~~~~~~~~~~~~
  //   Argument of type 'BinLocation' is not assignable to parameter of type 'Sku'.
  ```

  ### Why this works

  | concern | mechanism |
  |---------|-----------|
  | **Runtime value is still a `string`** | The brand is a phantom field (`__brand`) that exists only in the type system; `JSON.stringify`, `===`, and every string API work unchanged. |
  | **`Sku` and `BinLocation` are mutually incompatible** | Each carries a different literal tag, so the compiler refuses to unify them even though both sit on top of `string`. |
  | **The wrong-argument mistake is now a compile error** | `moveStock(binLocation, sku, toBin)` fails at `tsc` with *"Argument of type 'BinLocation' is not assignable to parameter of type 'Sku'"* — no runtime required. |
  | **Validation is centralised** | Every path that produces a `Sku` or `BinLocation` must pass through the smart constructor, so illegal values can never enter the type. |
