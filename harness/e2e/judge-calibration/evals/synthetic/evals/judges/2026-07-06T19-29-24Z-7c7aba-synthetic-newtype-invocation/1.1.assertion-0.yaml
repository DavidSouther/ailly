  USER QUESTION:
  Our checkout flow keeps a `cartId` and a `promoCodeId` around as plain
  strings, and a bug last week applied a promo code's id where a cart id
  was expected because both were just `string` in the function signature.
  Introduce distinct `CartId` and `PromoCodeId` types so that mistake is a
  compile error, not a runtime bug. Show the two type definitions and one
  function signature that applies a promo to a cart. Stay at the type
  layer only -- no classes, no database entities.


  CANDIDATE RESPONSE:
  ```typescript
  // ── Branded primitive types ──────────────────────────────────────────────────
  //
  // A brand is a phantom property that exists only in the type system.
  // At runtime these are plain strings; zero overhead, zero wrapping.

  type CartId      = string & { readonly _brand: "CartId" };
  type PromoCodeId = string & { readonly _brand: "PromoCodeId" };

  // ── Constructors (the only sanctioned entry points) ──────────────────────────
  //
  // All `as` casts live here, never at call sites.  Add any format validation
  // you need (e.g. UUID shape) in one place without touching the rest of the
  // codebase.

  function makeCartId(raw: string): CartId {
    if (raw.trim() === "") throw new Error("CartId must not be blank");
    return raw as CartId;
  }

  function makePromoCodeId(raw: string): PromoCodeId {
    if (raw.trim() === "") throw new Error("PromoCodeId must not be blank");
    return raw as PromoCodeId;
  }

  // ── Domain operation ─────────────────────────────────────────────────────────
  //
  // The compiler now enforces argument order.  Passing a PromoCodeId where a
  // CartId is expected — or vice-versa — is a type error, not a runtime
  // surprise.

  function applyPromoToCart(cartId: CartId, promoCodeId: PromoCodeId): void {
    // domain logic goes here
    console.log(`Applying promo ${promoCodeId} to cart ${cartId}`);
  }

  // ── Example call site ────────────────────────────────────────────────────────

  const cartId      = makeCartId("cart-9f4e2a");
  const promoCodeId = makePromoCodeId("SAVE10");

  applyPromoToCart(cartId, promoCodeId);   // ✓ compiles

  // The bug that prompted this change is now unrepresentable:
  // applyPromoToCart(promoCodeId, cartId);
  // ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
  // Argument of type 'PromoCodeId' is not assignable to parameter of type 'CartId'.
  ```

  ### What makes this safe

  | Risk | How brands eliminate it |
  |---|---|
  | `applyPromoToCart(promoId, cartId)` — swapped args | Both parameters are distinct brands; the compiler rejects the call |
  | `applyPromoToCart(rawString, rawString)` — unvalidated input | `string` is not assignable to `CartId` or `PromoCodeId`; you must go through a constructor |
  | `as` casts leaking out to call sites | All casts are inside `makeCartId` / `makePromoCodeId`; call sites are cast-free |

  The brands are phantom: they carry no runtime representation, so there is no wrapping object, no boxing, and no performance cost. The value you hand to a database or HTTP layer is still the plain string the constructor received.
