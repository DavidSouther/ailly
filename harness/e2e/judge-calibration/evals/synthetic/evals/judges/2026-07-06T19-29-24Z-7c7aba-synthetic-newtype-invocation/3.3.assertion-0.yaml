  RUBRIC:
  The code introduces a UserId type that wraps a string, exposes
  construction as the only sanctioned entry point, and makes a plain
  string unassignable where UserId is required. There are no `as`
  casts at call sites; validation lives once in the constructor.


  USER QUESTION:
  Two ids flow through our billing code as raw strings: `invoiceId` and
  `customerId`. We just shipped a refund that credited the wrong party
  because someone passed `customerId` into a helper that expected
  `invoiceId`, and TypeScript didn't complain because they're both just
  `string`. Give me distinct types for these two ids so a mixup like that
  fails to compile. Show the type declarations and the one call site that
  looks up an invoice by its id. Don't reach for a full entity class or an
  ORM model -- I only want the compile-time guard.


  CANDIDATE RESPONSE:
  ```typescript
  // ── Brand declarations ────────────────────────────────────────────────────────

  type InvoiceId  = string & { readonly _brand: "InvoiceId" };
  type CustomerId = string & { readonly _brand: "CustomerId" };

  // ── Constructors (the only sanctioned entry points) ───────────────────────────

  function makeInvoiceId(raw: string): InvoiceId {
    if (!raw.trim()) throw new Error("InvoiceId must not be blank");
    return raw as InvoiceId;
  }

  function makeCustomerId(raw: string): CustomerId {
    if (!raw.trim()) throw new Error("CustomerId must not be blank");
    return raw as CustomerId;
  }

  // ── A repository stub that demonstrates the compile-time guard ────────────────

  interface InvoiceRepository {
    findById(id: InvoiceId): Promise<{ id: InvoiceId; customerId: CustomerId; amountCents: number } | null>;
  }

  // ── Call site ─────────────────────────────────────────────────────────────────

  async function lookupInvoice(repo: InvoiceRepository, rawId: string) {
    const invoiceId = makeInvoiceId(rawId);
    return repo.findById(invoiceId);

    // The mistake that triggered the incident is now a compile error:
    //   const customerId = makeCustomerId(rawId);
    //   repo.findById(customerId);
    //                 ^^^^^^^^^^ Argument of type 'CustomerId' is not
    //                            assignable to parameter of type 'InvoiceId'.
  }
  ```

  ### Why this works

  | Concern | How it is addressed |
  |---|---|
  | `InvoiceId` and `CustomerId` are both `string` at runtime | The `_brand` phantom property makes them structurally incompatible to the **type checker** while adding zero runtime cost |
  | Raw `string` is not assignable to either brand | Any call site that skips the constructor is a compile error, so validation is centralised |
  | The `as` cast lives only in the constructors | Call sites never cast; the single entry point is the right place for any future format validation (UUID check, prefix check, etc.) |
  | Plain `type InvoiceId = string` would not help | A transparent alias is identical to `string` for the compiler; the intersection with `{ readonly _brand: … }` is what creates the incompatibility |
