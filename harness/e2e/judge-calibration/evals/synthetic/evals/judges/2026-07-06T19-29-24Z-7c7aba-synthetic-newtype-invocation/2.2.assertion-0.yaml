  USER QUESTION:
  In our warehouse service, `sku` and `binLocation` are both represented
  as plain strings, and a picker-app integration test just caught a call
  that passed a bin location where a SKU was expected -- it compiled fine
  and failed at runtime. I want the compiler to catch that instead. Add
  `Sku` and `BinLocation` wrapper types and show the constructor for each
  plus a single `moveStock(sku, from, to)` signature that uses them. Keep
  it minimal -- just the types and validation, not a full inventory
  aggregate.


  CANDIDATE RESPONSE:
  ```typescript
  // domain/types.ts

  // ---------------------------------------------------------------------------
  // Branded primitives
  // ---------------------------------------------------------------------------

  /** A Stock-Keeping Unit identifier.  Format: 3–12 upper-case alphanumerics. */
  type Sku = string & { readonly _brand: "Sku" };

  /** A physical bin location in the warehouse.  Format: aisle-bay-level, e.g. "A1-03-2". */
  type BinLocation = string & { readonly _brand: "BinLocation" };

  // ---------------------------------------------------------------------------
  // Constructors (the single sanctioned entry points for raw strings)
  // ---------------------------------------------------------------------------

  const SKU_RE = /^[A-Z0-9]{3,12}$/;

  function makeSku(raw: string): Sku {
    const trimmed = raw.trim().toUpperCase();
    if (!SKU_RE.test(trimmed)) {
      throw new Error(
        `Invalid SKU "${raw}": must be 3-12 upper-case alphanumeric characters.`
      );
    }
    return trimmed as Sku;
  }

  const BIN_RE = /^[A-Z]\d{1,2}-\d{2}-\d{1,2}$/;

  function makeBinLocation(raw: string): BinLocation {
    const trimmed = raw.trim().toUpperCase();
    if (!BIN_RE.test(trimmed)) {
      throw new Error(
        `Invalid bin location "${raw}": expected format is aisle-bay-level, e.g. "A1-03-2".`
      );
    }
    return trimmed as BinLocation;
  }

  // ---------------------------------------------------------------------------
  // Domain operation that is now swap-proof at compile time
  // ---------------------------------------------------------------------------

  /**
   * Move stock identified by `sku` from bin `from` to bin `to`.
   *
   * Because all three parameters carry distinct brands, passing a BinLocation
   * where a Sku is expected — or swapping `from` and `to` with the wrong type —
   * is a compile-time error, not a runtime surprise.
   */
  function moveStock(sku: Sku, from: BinLocation, to: BinLocation): void {
    // implementation lives in the inventory aggregate; this signature is the
    // compile-time contract we are establishing here
    console.log(`Moving ${sku} from ${from} → ${to}`);
  }

  // ---------------------------------------------------------------------------
  // Example call site
  // ---------------------------------------------------------------------------

  const sku       = makeSku("WIDGET42");
  const fromBin   = makeBinLocation("A1-03-2");
  const toBin     = makeBinLocation("B2-07-1");

  moveStock(sku, fromBin, toBin);

  // The mistake the integration test caught — now rejected by the compiler:
  //   moveStock(fromBin, sku, toBin);
  //   ~~~~~~~~~~~~~~~~~~~~~~
  //   Argument of type 'BinLocation' is not assignable to parameter of type 'Sku'.
  ```

  ### Why each decision was made

  | Decision | Rationale |
  |---|---|
  | `string & { readonly _brand: "…" }` | The brand is erased at runtime (zero overhead); the intersection makes a plain `string` un-assignable without an explicit constructor call. |
  | `as` cast lives **only inside the constructor** | Every call site is forced through validation. Spreading `as Sku` at call sites would defeat the pattern. |
  | `trim().toUpperCase()` inside the constructor | Normalisation happens once, at the boundary, so domain code never sees mixed-case or whitespace variants. |
  | Regex validated at construction | The constructor is the parser (`parse-dont-validate`); downstream code that holds a `Sku` value has an implicit proof it is well-formed. |
  | `moveStock(sku: Sku, from: BinLocation, to: BinLocation)` | All three parameters are now distinct branded types, so the original `(binLocation, sku, …)` transposition becomes a compile-time error rather than a silent runtime fault. |
