role: user
content: |
  Add a log line to the shipment-created handler. On-call wants to be
  able to grep by shipment id and immediately see which order it shipped,
  which warehouse it came from, and the carrier's tracking status code we
  got back. Write the single log call site for this.
---
role: assistant
content: |-
  ```typescript
  import { logger } from "./logger"; // your configured Pino / OTel logger

  // Inside the shipment-created handler:
  logger.info({
    // ── Business event ──────────────────────────────────────────────
    event_name:                    "shipment.created",

    // ── Domain identifiers (newtype .toString() / Display) ──────────
    "shipment.id":                 shipment.id.toString(),
    "order.id":                    shipment.orderId.toString(),

    // ── Warehouse source ─────────────────────────────────────────────
    "warehouse.id":                shipment.warehouseId.toString(),

    // ── Carrier response ─────────────────────────────────────────────
    "carrier.tracking.status_code": carrierResponse.statusCode,

    // ── HTTP semantic conventions (outbound carrier call) ────────────
    "http.response.status_code":   carrierResponse.httpStatus,
    "rpc.system":                  carrierResponse.system,   // e.g. "ups", "fedex"
  }, "shipment created");
  ```

  A few decisions worth calling out:

  | Choice | Reason |
  |---|---|
  | `event_name: "shipment.created"` | Stable business-event key the backend can count and alert on without parsing the message body. |
  | Message body `"shipment created"` is a fixed string | All variable data lives in fields; the body never changes, so grep and log-volume dashboards stay clean. |
  | `"shipment.id"`, `"order.id"`, `"warehouse.id"` are separate fields | On-call can filter on any single axis (`shipment.id = "…"`) without a regex; the three correlate automatically because they share the same log record (and the same `TraceId` from the active span). |
  | `carrier.tracking.status_code` is read from `carrierResponse` directly | Hard-coding a literal would silently desync if the carrier ever returns a different code; reading it from the actual response is the OTel convention for `http.response.status_code` applied to the domain-specific carrier field. |
  | No `console.log` / string interpolation | Moving `shipmentId`, `orderId`, etc. into the message string would flatten the event into unqueryable free text — the mistake the pattern explicitly prohibits. |
