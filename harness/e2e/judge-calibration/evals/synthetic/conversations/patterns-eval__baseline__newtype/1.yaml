  // Brand types for checkout identifiers
  declare const __cartId: unique symbol;
  declare const __promoCodeId: unique symbol;

  export type CartId = string & { readonly [__cartId]: never };
  export type PromoCodeId = string & { readonly [__promoCodeId]: never };

  // Constructor helpers — the only place raw strings cross the boundary
  export const CartId = (raw: string): CartId => raw as CartId;
  export const PromoCodeId = (raw: string): PromoCodeId => raw as PromoCodeId;

