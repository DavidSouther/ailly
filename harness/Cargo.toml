[package]
name = "ailly_two"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
glob = "0.3"
regex = "1"
# Coupled to rig-bedrock's "0.4" cap below: rig-bedrock-v0.4.7 requires
# rig-core = "0.38.0", so bumping this past 0.37 without also revisiting the
# rig-bedrock requirement will make the dependency graph unsatisfiable.
rig = { version = "0.37", package = "rig-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
vfs = "0.12"

# Capped below rig-bedrock-v0.4.7, which requires rig-core = "0.38.0" and is
# incompatible with the rig-core "0.37" pin above; see the comment there.
[dependencies.rig-bedrock]
version = "0.4"
optional = true

[dev-dependencies]
http = "1"
url = "2"

[features]
default = ["bedrock"]
bedrock = ["dep:rig-bedrock"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
