[package]
name = "shell-access"
version = "0.1.0"
description = "Report which files a recorded POSIX shell command attempted to read, write, or delete"
authors = ["Nominal Inc."]
edition = "2021"

[dependencies]
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
