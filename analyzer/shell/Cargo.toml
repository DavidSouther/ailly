[package]
name = "ailly-analyzer"
version = "0.1.0"
description = "A local-first desktop workspace for investigating completed agent sessions"
authors = ["Nominal Inc."]
edition = "2021"

[lib]
name = "ailly_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
shell-access = { path = "../shell-access" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
