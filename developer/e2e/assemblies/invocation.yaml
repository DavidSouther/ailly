name: invocation
model: claude-sonnet-4-6

# Post-consolidation (progressive-disclosure, developer-plugin consolidation): the only
# standalone developer skills left are `ailly` (the bootstrap + coordinator),
# `clean-comments-review`, and `code-review` (user-invoked and offered, not a review specialist). The five lifecycle phases live as references under the
# coordinator (../skills/ailly/references/phases/<phase>.md, exercised by
# invocation-phases.yaml), and the four progressive abilities (thinking, refactor,
# initialize, program-management) live as references too (../skills/ailly/references/...,
# exercised by invocation-abilities.yaml). This suite therefore carries only the `ailly`
# coordinator case. The bootstrap IS the ailly body, so it is loaded once.
#
# Paths are project-rooted; vendor.py populates ./context/ before assemble.
prefix:
  - { kind: file,   path: context/AGENTS.md,           cache: true }
  - { kind: file,   path: profile.md,                  cache: true }
  - { kind: external, path: ../skills/ailly/SKILL.md,  cache: true }

matrix:
  skill:
    - ailly

conversation:
  - { role: user, path: "prompts/invocation/{{ skill }}.md" }
  - { role: assistant }
