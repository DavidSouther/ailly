name: delegated-workflow-live
model: claude-opus-4-7

# CI-scoped variant of delegated-workflow. The full recipe names three provider
# families (anthropic/openai/google); this CI environment provisions only
# ANTHROPIC_API_KEY, so the live `ailly run` half of ci.sh assembles THIS
# assembly, which narrows the provider axis to anthropic alone and the domain
# axis to the cheap pair (prose-bio, code-sql). The full cross-provider matrix
# is still proven OFFLINE by assembling `delegated-workflow` (12 files), which
# needs no credentials. Everything else — prefix, turn sequence, distractor
# glob — is identical to the full recipe, so the live run exercises the same
# protocol on a keyed provider without ever calling an un-keyed endpoint.
#
# `assemble` has no `--var` axis-narrowing flag, so scoping is expressed as a
# separate committed assembly, mirroring how patterns-eval scopes its suites
# (discovery / baseline / invocation) into separate assembly files.

matrix:
  provider:
    - { name: anthropic, model: claude-opus-4-7 }
  domain:           [prose-bio, code-sql]
  distractor_count: [3]

prefix:
  - { kind: file,    path: ./AGENTS.md,                     cache: true }
  - { kind: system,  path: context/system/*.md,             cache: true }
  - { kind: file,    path: "context/seeds/{{ domain }}.md", cache: true }
  - { kind: context, source: context/distractors, glob: "*.md" }

conversation:
  - { role: user, path: prompts/turns/01-tighten.md }
  - { role: assistant }
  - { role: user, path: prompts/turns/02-add-context.md }
  - { role: assistant }
  - { role: user, path: prompts/turns/03-reorder.md }
  - { role: assistant }
  - { role: user, path: prompts/turns/04-soften.md }
  - { role: assistant }
  - { role: user, path: prompts/turns/05-summarise.md }
  - { role: assistant }
  - { role: user, path: prompts/turns/06-finalise.md }
  - { role: assistant }
