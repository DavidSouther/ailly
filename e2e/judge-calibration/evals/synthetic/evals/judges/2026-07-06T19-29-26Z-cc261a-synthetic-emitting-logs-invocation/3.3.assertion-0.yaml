  RUBRIC:
  The call site emits a structured log record with `EventName` set
  to `order.placed` and attaches fields under OpenTelemetry
  semantic-convention keys (`http.response.status_code`, `order.id`,
  `user.id`). The message body is a stable string; no values are
  interpolated into it.


  USER QUESTION:
  In the account-signup handler, add a log line for when a new account is
  created. On-call needs to grep by the new user id and see which
  signup-flow variant they came through and what HTTP status code we
  returned to the client. Write the one log call as you would for this
  service.


  CANDIDATE RESPONSE:
  ```typescript
  import { logger } from "./logger"; // the configured Pino / OTel logger for this service

  // Inside the account-signup request handler, after the account has been
  // persisted and the HTTP response status is known:

  logger.info({
    // ── Business event name (stable, machine-countable) ──────────────────
    event_name: "account.created",

    // ── Identity ─────────────────────────────────────────────────────────
    "user.id": newUser.id.toString(),          // UserId newtype → stable key

    // ── HTTP semantic conventions ─────────────────────────────────────────
    "http.request.method":      "POST",
    "http.route":               "/accounts/signup",
    "http.response.status_code": response.statusCode,  // read from the real response

    // ── Domain / experiment context ───────────────────────────────────────
    "feature_flag.key":         "signup-flow",
    "feature_flag.variant":     req.signupFlowVariant, // e.g. "control" | "streamlined-v2"
  }, "account created");
  ```

  A few things worth calling out:

  | Decision | Why |
  |---|---|
  | `event_name: "account.created"` | Gives the backend a stable pivot point to count signups, derive a rate, or set an SLO — without parsing the message body. |
  | `"user.id"` not `userId` | OpenTelemetry semantic-convention key; dashboards and auto-instrumentation already know this name. On-call's grep lands on a queryable field. |
  | `response.statusCode` read from the actual response | Never hard-code `201` here. If the handler ever returns `202 Accepted` after an async queue is introduced, the log stays correct automatically. |
  | `"feature_flag.key"` / `"feature_flag.variant"` | OTel semantic-convention keys for feature-flag context. The signup-flow variant the caller asked for is on-call's second grep dimension. |
  | Message body is a stable string — no interpolation | `"account created"` never changes regardless of input, so log aggregators can group on the body as a secondary signal. All variable data lives in fields. |

  PROGRAM_OUTPUTS:
  [script] R3 semantic-convention keys: missing order.id; use the OpenTelemetry semantic-convention keys, not ad-hoc field names
