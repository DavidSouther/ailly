name: synthetic-emitting-logs-invocation
model: claude-sonnet-4-6

matrix:
  variant:
    - "1"
    - "2"
    - "3"

prefix:
  - { kind: file,   path: ./AGENTS.md,                              cache: true }
  - { kind: file,   path: ./context/AGENTS.md,                      cache: true }
  - { kind: system, path: ./context/skills/using-patterns/SKILL.md, cache: true }
  - { kind: system, path: ./context/skills/emitting-logs/SKILL.md,  cache: true }

conversation:
  - { role: user, path: "prompts/synthetic/emitting-logs/{{ variant }}.md" }
  - { role: assistant }
