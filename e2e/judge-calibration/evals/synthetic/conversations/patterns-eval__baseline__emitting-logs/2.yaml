content: |
  Add a log line to the shipment-created handler. On-call wants to be
  able to grep by shipment id and immediately see which order it shipped,
  which warehouse it came from, and the carrier's tracking status code we
  got back. Write the single log call site for this.
---
role: assistant
content: |-
  ```typescript
  import { log } from "./logger";

  function onShipmentCreated(event: ShipmentCreatedEvent): void {
    // … handler logic …

    log.emit({
      eventName:       "shipment.created",
      "shipment.id":   event.shipmentId,
      "order.id":      event.orderId,
      "warehouse.id":  event.warehouseId,
      "carrier.tracking.statusCode": event.carrierStatusCode,
    });
  }
  ```

  Key decisions driven by the structured-logging skill:

  | Choice | Reason |
  |---|---|
  | `eventName` field | Required discriminator — lets on-call filter to exactly this event class with `grep eventName=shipment.created` |
  | Separate keyed fields instead of an interpolated string | Each dimension (`shipment.id`, `order.id`, `warehouse.id`, `carrier.tracking.statusCode`) is independently grep-able and indexable |
  | Dotted namespaced keys | Follow semantic-convention style so log aggregators can correlate across services without collisions |
  | No message template | Nothing is baked into a prose string where a value would be buried; every value lives in its own key |
