# Judge registry for judge-calibration (step 1 of the relevance-matrix
# pipeline). Generated by discover_judges.py from every `type: judge`
# assertion under e2e/*/evals/*.yaml — re-run that script to refresh
# after an eval suite changes; do not hand-edit `keywords` (edit the
# source eval suite's assertions instead, so this stays derived).
#
# Schema (one entry per judge assertion found):
#   judge_id: <suite>/<eval-stem>/<case-name>            # stable, unique
#   suite: <e2e/ subdirectory name>
#   suite_file: <path to the .yaml the judge assertion lives in>
#   case_name: <Case.name, or null for an unnamed/`when`-only case>
#   case_when: <Case.when map, or null>
#   prompt: <the judge assertion's full rubric text>
#   keywords: [{value, polarity: include|exclude, source}]
#     source is one of: sibling (exact, from a text_contains/
#     text_not_contains in the same case), prompt (exact, regex over
#     the judge's own prompt text), assembly+suite-convention or
#     assembly-external-skill-path (inferred from the case's assembly
#     + this suite's own token conventions — see discover_judges.py's
#     module docstring), or absent entirely when keywords is [].
#   needs_human_review: true when keywords is empty — no automated
#     candidate matching is possible for this judge; a human should
#     browse the mined candidates for it manually.

judges:
- judge_id: clean-comments-review/invocation/clean-comments-review
  suite: clean-comments-review
  suite_file: e2e/clean-comments-review/evals/invocation.yaml
  case_name: clean-comments-review
  case_when: null
  prompt: 'The review is a critique document, not edits to the code. It

    classifies the comment on `className` as a public DocBlock addressed

    to an external reader, flags that the DocBlock encodes current usage

    and call sites that will rot, and recommends cutting the comment back

    to its intent (or removing it). It does not conclude that the comments

    are fine as they are.

    '
  keywords:
  - value: clean-comments-review
    polarity: include
    source: assembly-external-skill-path
  needs_human_review: false
- judge_id: delegate-52/corruption/case4
  suite: delegate-52
  suite_file: e2e/delegate-52/evals/corruption.yaml
  case_name: null
  case_when: null
  prompt: 'For each domain, compare the final document (last assistant turn)

    from anthropic, openai, and google against its seed. Identify any

    named entity, date, citation, or numeric value that drifted in any

    provider''s output. Report the per-provider corruption count and

    the per-domain worst offender. Do not re-score; consume the

    per-domain scorer output attached as PROGRAM_OUTPUTS.

    '
  keywords: []
  needs_human_review: true
- judge_id: insurance-claim/regression/over-limit
  suite: insurance-claim
  suite_file: e2e/insurance-claim/evals/regression.yaml
  case_name: over-limit
  case_when: null
  prompt: 'The response routes the claim to human-review and cites the

    $10,000 auto-approve ceiling from the constraints fragment.

    '
  keywords: []
  needs_human_review: true
- judge_id: patterns-eval/baseline/newtype
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/baseline.yaml
  case_name: newtype
  case_when: null
  prompt: 'The code introduces a UserId type that wraps a string, exposes

    construction as the only sanctioned entry point, and makes a plain

    string unassignable where UserId is required. There are no `as`

    casts at call sites; validation lives once in the constructor.

    '
  keywords:
  - value: patterns:newtype
    polarity: include
    source: sibling-suite-case-name(assembly+suite-convention)
  needs_human_review: false
- judge_id: patterns-eval/baseline/configuring-logging
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/baseline.yaml
  case_name: configuring-logging
  case_when: null
  prompt: 'The bootstrap installs a single subscriber registry in main with

    Format, Filter, Enrich, and Export layers, attaches `service.*`

    resource attributes, installs the W3C `traceparent` propagator,

    and registers a shutdown flush with a hard timeout. No `init` is

    called from library code.

    '
  keywords:
  - value: patterns:configuring-logging
    polarity: include
    source: sibling-suite-case-name(assembly+suite-convention)
  needs_human_review: false
- judge_id: patterns-eval/baseline/emitting-logs
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/baseline.yaml
  case_name: emitting-logs
  case_when: null
  prompt: 'The call site emits a structured log record with `EventName` set

    to `order.placed` and attaches fields under OpenTelemetry

    semantic-convention keys (`http.response.status_code`, `order.id`,

    `user.id`). The message body is a stable string; no values are

    interpolated into it.

    '
  keywords:
  - value: patterns:emitting-logs
    polarity: include
    source: sibling-suite-case-name(assembly+suite-convention)
  needs_human_review: false
- judge_id: patterns-eval/discovery/paired-add-propagator
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/discovery.yaml
  case_name: paired-add-propagator
  case_when: null
  prompt: 'The answer selects patterns:configuring-logging because the W3C

    propagator is installed once at process bootstrap. It does not

    recommend patterns:emitting-logs.

    '
  keywords:
  - value: patterns:configuring-logging
    polarity: include
    source: sibling
  - value: patterns:emitting-logs
    polarity: exclude
    source: sibling
  needs_human_review: false
- judge_id: patterns-eval/discovery/paired-log-handler-success
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/discovery.yaml
  case_name: paired-log-handler-success
  case_when: null
  prompt: 'The answer selects patterns:emitting-logs because the success

    occurs inside an already-bootstrapped handler. It does not

    recommend re-running patterns:configuring-logging.

    '
  keywords:
  - value: patterns:emitting-logs
    polarity: include
    source: sibling
  - value: patterns:configuring-logging
    polarity: exclude
    source: sibling
  needs_human_review: false
- judge_id: patterns-eval/invocation/newtype
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/invocation.yaml
  case_name: newtype
  case_when: null
  prompt: 'The code introduces a UserId type that wraps a string, exposes

    construction as the only sanctioned entry point, and makes a plain

    string unassignable where UserId is required. There are no `as`

    casts at call sites; validation lives once in the constructor.

    '
  keywords:
  - value: patterns:newtype
    polarity: include
    source: assembly+suite-convention
  needs_human_review: false
- judge_id: patterns-eval/invocation/configuring-logging
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/invocation.yaml
  case_name: configuring-logging
  case_when: null
  prompt: 'The bootstrap installs a single subscriber registry in main with

    Format, Filter, Enrich, and Export layers, attaches `service.*`

    resource attributes, installs the W3C `traceparent` propagator,

    and registers a shutdown flush with a hard timeout. No `init` is

    called from library code.

    '
  keywords:
  - value: patterns:configuring-logging
    polarity: include
    source: assembly+suite-convention
  needs_human_review: false
- judge_id: patterns-eval/invocation/emitting-logs
  suite: patterns-eval
  suite_file: e2e/patterns-eval/evals/invocation.yaml
  case_name: emitting-logs
  case_when: null
  prompt: 'The call site emits a structured log record with `EventName` set

    to `order.placed` and attaches fields under OpenTelemetry

    semantic-convention keys (`http.response.status_code`, `order.id`,

    `user.id`). The message body is a stable string; no values are

    interpolated into it.

    '
  keywords:
  - value: patterns:emitting-logs
    polarity: include
    source: assembly+suite-convention
  needs_human_review: false
