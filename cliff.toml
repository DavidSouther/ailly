[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
Entries are generated by [git-cliff](https://github.com/orhun/git-cliff) from [Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="release/") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat!", group = "Breaking Changes" },
  { body = ".*BREAKING CHANGE.*", group = "Breaking Changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore|^refactor|^test|^perf|^style", skip = true },
]
protect_breaking_commits = true
filter_commits = true
exclude_paths = ["analyzer/**", "harness/**"]
tag_pattern = "release/[0-9]{4}\\.[0-9]{2}\\.[0-9]+"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
